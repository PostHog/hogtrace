name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  rust-tests:
    name: Rust Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master
        with:
          toolchain: stable

      - name: Prepend rustup toolchain bin dir to PATH
        # macos-latest arm64 runners ship `~/.cargo/bin/cargo` as a stale
        # `rustup-init` shim, not the multi-call rustup binary. So even
        # after rustup default stable, `cargo` / `rustc` on PATH fall
        # through to the broken shim and tools like maturin die with
        # "unexpected `rustc -vV` format". Ask rustup where the real
        # cargo for the active toolchain lives, and prepend its parent
        # directory (the toolchain's own bin/, with the actual binaries).
        run: |
          set -euo pipefail
          TOOLCHAIN_BIN="$(dirname "$(rustup which cargo)")"
          echo "Prepending $TOOLCHAIN_BIN to PATH"
          echo "$TOOLCHAIN_BIN" >> "$GITHUB_PATH"
        shell: bash

      - name: Install protoc
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y protobuf-compiler
          elif [ "$RUNNER_OS" == "macOS" ]; then
            brew install protobuf
          fi
        shell: bash

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1

      - name: Run Rust tests
        run: cargo test --lib --verbose

      - name: Check Rust formatting
        run: cargo fmt -- --check
        continue-on-error: true

      - name: Run Clippy
        run: cargo clippy --lib -- -D warnings
        continue-on-error: true

  python-tests:
    name: Python Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master
        with:
          toolchain: stable

      - name: Prepend rustup toolchain bin dir to PATH
        # See the matching step in the rust-tests job for rationale.
        run: |
          set -euo pipefail
          TOOLCHAIN_BIN="$(dirname "$(rustup which cargo)")"
          echo "Prepending $TOOLCHAIN_BIN to PATH"
          echo "$TOOLCHAIN_BIN" >> "$GITHUB_PATH"
        shell: bash

      - name: Install protoc
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y protobuf-compiler
          elif [ "$RUNNER_OS" == "macOS" ]; then
            brew install protobuf
          fi
        shell: bash

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install UV
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install maturin pytest

      - name: Build Rust extension
        run: |
          source .venv/bin/activate
          maturin develop

      - name: Run Python tests
        run: |
          source .venv/bin/activate
          pytest tests/ -v

  build:
    name: Build Wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@67ef31d5b988238dd797d409d6f9574278e20537 # master
        with:
          toolchain: stable

      - name: Prepend rustup toolchain bin dir to PATH
        # See the matching step in the rust-tests job for rationale.
        run: |
          set -euo pipefail
          TOOLCHAIN_BIN="$(dirname "$(rustup which cargo)")"
          echo "Prepending $TOOLCHAIN_BIN to PATH"
          echo "$TOOLCHAIN_BIN" >> "$GITHUB_PATH"
        shell: bash

      - name: Install protoc
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y protobuf-compiler
          elif [ "$RUNNER_OS" == "macOS" ]; then
            brew install protobuf
          fi
        shell: bash

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install maturin
        run: pip install maturin

      - name: Build wheels
        run: maturin build --release

      - name: Upload wheels
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheels-${{ matrix.os }}
          path: target/wheels/*.whl

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install ruff mypy

      - name: Run ruff
        run: ruff check hogtrace/
        continue-on-error: true

      - name: Run mypy
        run: mypy hogtrace/ --ignore-missing-imports
        continue-on-error: true
